[package]
name = "datafusion-sharp-native"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "unwind"
lto = "thin"

[profile.dev]
panic = "unwind"

[features]
# mimalloc as the global allocator of the native library: see native/src/lib.rs
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1.0.102"
arrow-array = { version = "58.1.0", features = ["ffi"] }
bytes = "1.11.1"
datafusion = "53.1.0"
datafusion-proto = "53.1.0"
futures = "0.3.32"
log = {version = "0.4.29", features = ["std"]}
mimalloc = { version = "0.1", optional = true }
object_store = { version = "0.13.2", features = ["aws", "azure", "gcp", "http"] }
prost = "0.14.3"
reqwest = { version = "0.13.2", default-features = false }
tokio = { version = "1.52.1", features = ["rt-multi-thread"] }
tokio-util = "0.7.18"
url = "2.5.8"

[build-dependencies]
prost-build = "0.14.3"

# musl's loader refuses initial-exec TLS in a library loaded with dlopen, as .NET loads native libraries ("initial-exec TLS resolves to dynamic
# definition"); glibc tolerates it. mimalloc must use local-dynamic TLS there.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", optional = true, features = ["local_dynamic_tls"] }
